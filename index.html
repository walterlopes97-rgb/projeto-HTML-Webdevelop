<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WeatherApp - Previsão do Tempo</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header
        id="main-header"
        class="header-thumb-dia"
    >

        <!-- =================================================
             CALENDÁRIO
             ================================================= -->

        <aside
            class="calendario"
            aria-label="Calendário Informativo"
        >
            <input
                type="date"
                id="calendar-date"
                aria-label="Selecionar data"
            >
        </aside>


        <!-- =================================================
             INFORMAÇÕES DO CLIMA
             ================================================= -->

        <div class="header-weather-info">


            <h1 id="header-city">
                Carregando localização...
            </h1>


            <p id="header-time">
                Horário: 12:00
            </p>


            <p id="header-condition">
                Carregando previsão...
            </p>


            <span id="header-temp">
                --°C
            </span>

        </div>


        <!-- =================================================
             CONTROLE DE HORÁRIO
             ================================================= -->

        <div class="time-slider-container">

            <label
                for="time-control"
                class="sr-only"
            >
                Ajustar horário do dia
            </label>

            <input
                type="range"
                id="time-control"
                min="0"
                max="1440"
                value="720"
                step="60"
                aria-label="Controle de horário do dia"
            >


            <div
                id="celestial-body"
                class="sun-icon"
                aria-hidden="true"
            ></div>

        </div>

    </header>



    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->

    <main class="container">

        <section
            class="weekly-forecast"
            aria-labelledby="forecast-title"
        >


            <h2
                id="forecast-title"
                class="sr-only"
            >
                Previsão Semanal
            </h2>



            <div
                class="cards-row"
                id="cards-container"
            >

            </div>

        </section>

    </main>



    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer class="main-footer">

        <p>
            &copy; 2026 Projeto Acadêmico de Previsão do Tempo
        </p>


        <!-- =================================================
             REDES SOCIAIS
             ================================================= -->

        <nav
            class="social-nav"
            aria-label="Redes Sociais"
        >

            <ul class="social-links">

                <li>

                    <a
                        href="https://www.instagram.com/walter_lopsil?stkn=aGwwZXBvenlwM3Jm"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Instagram"
                    >
                        Instagram
                    </a>

                </li>


                <li>

                    <a
                        href="https://www.facebook.com/share/1cqMx1gtNB/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Facebook"
                    >
                        Facebook
                    </a>

                </li>

            </ul>

        </nav>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="app.js"></script>

</body>

</html>
